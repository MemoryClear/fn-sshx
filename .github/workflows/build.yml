name: Build fpk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Setup fnpack
        run: |
          sudo cp ./fnpack /usr/local/bin/fnpack
          sudo chmod +x /usr/local/bin/fnpack
          fnpack --help

      - name: Install Node.js dependencies
        run: npm install
        working-directory: app/server

      - name: Build single-file UI
        shell: pwsh
        run: |
          echo "=== Verifying build_single.ps1 exists ==="
          ls -la build_single.ps1
          echo "=== Running build_single.ps1 ==="
          ./build_single.ps1
          echo "=== Verifying index.html generated ==="
          ls -la app/ui/index.html

      - name: Build fpk package
        run: fnpack build

      - name: Verify fpk output
        run: |
          ls -lh sshx.fpk
          echo "=== manifest ==="
          cat manifest

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: sshx v${{ steps.version.outputs.version }}
          files: sshx.fpk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

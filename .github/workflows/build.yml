name: Build fpk

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version\s*=' manifest | sed 's/version\s*=\s*//' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup fnpack
        run: |
          sudo cp ./fnpack /usr/local/bin/fnpack
          sudo chmod +x /usr/local/bin/fnpack
          fnpack version

      - name: Install Node.js dependencies
        run: npm install
        working-directory: app/server

      - name: Build single-file UI
        shell: pwsh
        run: ./build_single.ps1

      - name: Build fpk package
        run: fnpack build -d .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: sshx v${{ steps.version.outputs.version }}
          files: sshx.fpk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

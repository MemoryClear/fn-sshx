name: Build fpk

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup fnpack
        run: |
          sudo cp ./fnpack /usr/local/bin/fnpack
          sudo chmod +x /usr/local/bin/fnpack
          fnpack version
      
      - name: Install Node.js dependencies
        run: npm install
        working-directory: app/server
      
      - name: Build single-file UI
        shell: pwsh
        run: ./build_single.ps1
      
      - name: Build fpk package
        run: fnpack build -d .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sshx-fpk
          path: sshx.fpk
